[package]
name = "windcore"
version = "0.1.0"
edition = "2024"

[lib]
name = "windcore"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
md5 = "0.8.0"
base64 = "0.22.1"
log = "0.4.33"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
tracing-appender = "0.2.5"
env_logger = "0.11.10"
anyhow = "1.0.102"
dashmap = "6.1.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "json",
    "query",
    "stream",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "cookies",
    "multipart",
    "rustls",
    "system-proxy",
    "socks",
] }
reqwest-middleware = { version = "0.5.2", features = [
    "form",
    "json",
    "multipart",
    "query",
] }
reqwest_dav = "0.3.3"
url = "2.5.8"
tokio-tar = "0.3.1"
zip = { version = "8.2.0", default-features = false, features = [
    "deflate",
    "time",
] }
zhconv = "0.4.1"
lazy_static = "1.5.0"
flate2 = "1.1.9"
zstd = "0.13.3"
rquickjs_playground = { path = "rquickjs_playground" }
chrono = "0.4.45"
iana-time-zone = "0.1.61"
sys-locale = "0.3.2"
tz-rs = "0.7.3"
icu_locale = { version = "2.2.0", features = ["compiled_data"] }
icu_time = "2.2.0"
terminal_size = "0.4.4"
ferrous-opencc = { version = "0.4.0", features = ["japanese-conversion"] }
brotli = "8.0.4"
sevenz-rust = "0.6.1"
webp = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde-xml-rs = "0.8.2"
ciborium = "0.2.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
tracing-logcat = "0.1.0"
jni = "0.22.4"
rustls-platform-verifier = "0.7.0"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = "0.2.0"

[build-dependencies]
ureq = "3.3.0"

[profile.dev]
# 关闭调试符号生成
debug = 0

# 减少中间产物
opt-level = 1

# 减少增量编译生成的碎片文件
incremental = true

# 可选功能：域名前置（IP 直连 / SNI 绕过）。
# 默认关闭（不进 default features）。开启后宿主才会注册 __http_set/get/clear_front_hosts
# 三个全局函数；关闭时这三个函数不会被注册，插件探测到缺失即视为「宿主不支持」，
# 与未打补丁的行为完全一致，不会有任何 IP 改写发生。
[features]
# 注意：真正的 `#[cfg(feature = "host-fronting")]` 门控在 rquickjs_playground crate 里，
# 所以这里必须**转发**该 feature，而不是只声明一个空 feature——否则 feature 打开后
# 门控代码仍不会被编译，三个全局函数不会注册。
host-fronting = ["rquickjs_playground/host-fronting"]

[patch.crates-io]
# quickjs-ng 0.15.1 + 安全/性能补丁，补丁清单见 fork 仓库的 PATCHES.md。
rquickjs-sys = { git = "https://github.com/deretame/breeze-rquickjs-sys", rev = "846889c482ee7511f558595384673f55c00c9f4a" }
